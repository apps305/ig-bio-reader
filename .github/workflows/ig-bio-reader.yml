name: ig-bio-reader

on:
  schedule:
    # every 2 min: warm pool without burning the portal's D1 read cap
    # (5 concurrent 5-min runs x 1-min cron x per-second ticks blew it 2026-09-28)
    - cron: "*/2 * * * *"
  workflow_dispatch:
    inputs:
      handle:
        description: handle to read first
        required: false
      reel:
        description: single reel code to read views+likes for
        required: false
  push:
    paths:
      - "gh-bio-reader.py"
      - ".github/workflows/ig-bio-reader.yml"

jobs:
  read-bios:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BIO_REPORT_KEY: br-4f2a9c71e8d34b6a9f0e2d7c5b8a1346
      PORTAL_URL: https://clipping.onyxpointmanagement.net
      PENDING_HANDLE: ${{ github.event.inputs.handle }}
      PENDING_REEL: ${{ github.event.inputs.reel }}
    steps:
      - uses: actions/checkout@v4
      # ubuntu-24.04 runners ship python 3.12 preinstalled; skipping
      # setup-python shaves seconds off every boot (owner 2026-09-27)
      - name: Read pending bios from runner egress
        run: python -u gh-bio-reader.py
